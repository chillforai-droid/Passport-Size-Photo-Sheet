<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Passport Photo Sheet Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f4f6;color:#111827}main{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;box-shadow:0 8px 25px #0000000b}h1{margin:0 0 8px;font-size:clamp(24px,5vw,40px)}p{color:#6b7280}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:700;margin:14px 0 6px}input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #d1d5db;font:inherit}button{cursor:pointer;background:#111827;color:white;font-weight:700;margin-top:12px}button.secondary{background:#fff;color:#111827}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.preview{background:#e5e7eb;border-radius:14px;padding:12px;overflow:auto}.sheet{background:white;width:794px;min-height:1123px;margin:auto;padding:38px;display:grid;align-content:start;gap:14px;grid-template-columns:repeat(4,1fr)}.photo{width:100%;aspect-ratio:35/45;object-fit:cover;border:1px solid #d1d5db;background:white}.hint{font-size:13px;color:#6b7280}.status{font-weight:700;margin-top:10px}.hidden{display:none}
</style>
</head>
<body>
<main>
<div class="card" style="margin-bottom:18px">
<h1>Passport Photo Sheet Maker</h1>
<p>अपनी फोटो चुनें और A4 शीट पर कई फोटो तैयार करें। Processing आपके browser में होती है।</p>
</div>
<div class="grid">
<section class="card">
<label for="photo">अपनी फोटो चुनें</label>
<input id="photo" type="file" accept="image/*" />
<label for="preset">Photo Size</label>
<select id="preset"><option value="35x45">35 × 45 mm</option><option value="25x35">25 × 35 mm</option><option value="2x2">2 × 2 inch</option></select>
<label for="columns">एक row में फोटो</label>
<select id="columns"><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
<label for="copies">कुल फोटो</label>
<select id="copies"><option>8</option><option selected>16</option><option>20</option><option>24</option><option>32</option><option>40</option><option>48</option></select>
<div class="row"><button id="generate">Sheet बनाएं</button><button class="secondary" id="print" disabled>Print / PDF</button></div>
<button class="secondary" id="download" disabled>JPG डाउनलोड करें</button>
<div class="hint">यह tool केवल layout बनाता है। आवेदन की official photo requirements अलग हो सकती हैं।</div>
<div id="status" class="status"></div>
</section>
<section class="card">
<div class="preview"><div id="sheet" class="sheet"><div style="grid-column:1/-1;text-align:center;color:#9ca3af">फोटो चुनकर Sheet बनाएं</div></div></div>
</section>
</div>
</main>
<script>
const photoInput=document.getElementById('photo'), sheet=document.getElementById('sheet'), generate=document.getElementById('generate'), printBtn=document.getElementById('print'), downloadBtn=document.getElementById('download'), statusEl=document.getElementById('status');
let imageUrl='', lastCanvas=null;
photoInput.addEventListener('change',()=>{if(photoInput.files[0]){imageUrl=URL.createObjectURL(photoInput.files[0]);statusEl.textContent='फोटो चुनी गई है। अब Sheet बनाएं।'}});
function makeSheet(){if(!imageUrl){alert('पहले फोटो चुनें');return}const count=Number(document.getElementById('copies').value),cols=Number(document.getElementById('columns').value);sheet.style.gridTemplateColumns=`repeat(${cols},1fr)`;sheet.innerHTML='';for(let i=0;i<count;i++){const img=document.createElement('img');img.className='photo';img.src=imageUrl;img.alt='Passport photo';sheet.appendChild(img)}printBtn.disabled=false;downloadBtn.disabled=false;statusEl.textContent=`${count} फोटो की sheet तैयार है।`;createCanvas(count,cols)}
function createCanvas(count,cols){const canvas=document.createElement('canvas');canvas.width=2480;canvas.height=3508;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);const margin=120,gap=35,rows=Math.ceil(count/cols),cellW=(canvas.width-margin*2-gap*(cols-1))/cols,cellH=520;const img=new Image();img.onload=()=>{for(let i=0;i<count;i++){const c=i%cols,r=Math.floor(i/cols),x=margin+c*(cellW+gap),y=margin+r*(cellH+gap);const ratio=Math.max(cellW/img.width,cellH/img.height);const w=img.width*ratio,h=img.height*ratio;const sx=(w-cellW)/2,sy=(h-cellH)/2;ctx.save();ctx.beginPath();ctx.rect(x,y,cellW,cellH);ctx.clip();ctx.drawImage(img,x-sx,y-sy,w,h);ctx.restore();ctx.strokeStyle='#d1d5db';ctx.strokeRect(x,y,cellW,cellH)}lastCanvas=canvas};img.src=imageUrl}
printBtn.addEventListener('click',()=>window.print());downloadBtn.addEventListener('click',()=>{if(!lastCanvas)return;const a=document.createElement('a');a.download='passport-photo-sheet.jpg';a.href=lastCanvas.toDataURL('image/jpeg',.92);a.click()});generate.addEventListener('click',makeSheet);
</script>
</body></html>
