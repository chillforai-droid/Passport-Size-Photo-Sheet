<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Passport Photo Sheet Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f4f6;color:#111827}main{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 8px 25px #0000000b}h1{margin:0 0 8px;font-size:clamp(24px,5vw,40px)}p{color:#6b7280}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:700;margin:14px 0 6px}input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #d1d5db;font:inherit}button{cursor:pointer;background:#111827;color:white;font-weight:700;margin-top:12px}button.secondary{background:#fff;color:#111827}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.preview{background:#e5e7eb;border-radius:14px;padding:12px;overflow:auto}.sheet{background:white;width:794px;min-height:1123px;margin:auto;padding:38px;display:grid;align-content:start;gap:14px;grid-template-columns:repeat(4,1fr)}.photo{display:block;width:100%;aspect-ratio:35/45;object-fit:cover;border:1px solid #d1d5db;background:white}.hint{font-size:13px;color:#6b7280}.status{font-weight:700;margin-top:10px}.empty{grid-column:1/-1;text-align:center;color:#9ca3af;padding:40px 10px}.thumb{max-width:100%;max-height:180px;display:block;margin:12px auto;border-radius:10px;border:1px solid #ddd}
@media print{body{background:white}.no-print{display:none!important}.preview{padding:0;background:white;overflow:visible}.sheet{width:210mm;min-height:297mm;padding:10mm;gap:4mm;box-shadow:none}.card{border:0;box-shadow:none;padding:0}.grid{display:block}main{padding:0}.sheet .photo{break-inside:avoid}}
</style>
</head>
<body>
<main>
<div class="card no-print" style="margin-bottom:18px">
<h1>Passport Photo Sheet Maker</h1>
<p>अपनी फोटो चुनें और A4 शीट पर कई फोटो तैयार करें। फोटो आपके browser में ही process होती है।</p>
</div>
<div class="grid">
<section class="card no-print">
<label for="photo">अपनी फोटो चुनें</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/*" />
<img id="sourcePreview" class="thumb" alt="चुनी गई फोटो का preview" hidden />
<label for="preset">Photo Size</label>
<select id="preset"><option value="35x45">35 × 45 mm</option><option value="25x35">25 × 35 mm</option><option value="2x2">2 × 2 inch</option></select>
<label for="columns">एक row में फोटो</label>
<select id="columns"><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
<label for="copies">कुल फोटो</label>
<select id="copies"><option>8</option><option selected>16</option><option>20</option><option>24</option><option>32</option><option>40</option><option>48</option></select>
<div class="row"><button id="generate">Sheet बनाएं</button><button class="secondary" id="print" disabled>Print / PDF</button></div>
<button class="secondary" id="download" disabled>JPG डाउनलोड करें</button>
<div class="hint" style="margin-top:10px">यह layout tool है। आवेदन की official photo requirements अलग हो सकती हैं।</div>
<div id="status" class="status" role="status"></div>
</section>
<section class="card">
<div class="preview"><div id="sheet" class="sheet"><div class="empty">फोटो चुनकर Sheet बनाएं</div></div></div>
</section>
</div>
</main>
<script>
const photoInput=document.getElementById('photo');
const sourcePreview=document.getElementById('sourcePreview');
const sheet=document.getElementById('sheet');
const generate=document.getElementById('generate');
const printBtn=document.getElementById('print');
const downloadBtn=document.getElementById('download');
const statusEl=document.getElementById('status');
let imageDataUrl='';
let lastCanvas=null;
let sourceImage=null;

photoInput.addEventListener('change',()=>{
  const file=photoInput.files && photoInput.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){alert('कृपया image file चुनें।');return;}
  const reader=new FileReader();
  reader.onload=()=>{
    imageDataUrl=String(reader.result);
    sourcePreview.src=imageDataUrl;
    sourcePreview.hidden=false;
    sourceImage=new Image();
    sourceImage.onload=()=>{statusEl.textContent='फोटो तैयार है। अब Sheet बनाएं।';};
    sourceImage.onerror=()=>{statusEl.textContent='फोटो पढ़ी नहीं जा सकी। दूसरी फोटो चुनें।';imageDataUrl='';};
    sourceImage.src=imageDataUrl;
  };
  reader.onerror=()=>{statusEl.textContent='फोटो पढ़ने में समस्या हुई।';};
  reader.readAsDataURL(file);
});

function getPhotoRatio(){
  const preset=document.getElementById('preset').value;
  if(preset==='25x35') return 25/35;
  if(preset==='2x2') return 1;
  return 35/45;
}

function makeSheet(){
  if(!imageDataUrl || !sourceImage || !sourceImage.complete){alert('पहले एक valid फोटो चुनें और फिर दोबारा प्रयास करें।');return;}
  const count=Number(document.getElementById('copies').value);
  const cols=Number(document.getElementById('columns').value);
  const ratio=getPhotoRatio();
  sheet.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
  sheet.innerHTML='';
  for(let i=0;i<count;i++){
    const img=document.createElement('img');
    img.className='photo';
    img.src=imageDataUrl;
    img.alt='Passport photo';
    img.style.aspectRatio=String(ratio);
    sheet.appendChild(img);
  }
  createCanvas(count,cols,ratio);
}

function createCanvas(count,cols,ratio){
  const canvas=document.createElement('canvas');
  canvas.width=2480; canvas.height=3508;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  const margin=120,gap=35,usableW=canvas.width-margin*2-gap*(cols-1);
  const cellW=usableW/cols;
  const cellH=cellW/ratio;
  const rows=Math.ceil(count/cols);
  const totalH=margin*2+rows*cellH+(rows-1)*gap;
  const scale=Math.min(1,(canvas.height-margin*2)/(totalH-margin*2));
  const finalCellW=cellW*scale,finalCellH=cellH*scale,finalGap=gap*scale;
  const img=new Image();
  img.onload=()=>{
    for(let i=0;i<count;i++){
      const c=i%cols,r=Math.floor(i/cols);
      const x=margin+c*(finalCellW+finalGap),y=margin+r*(finalCellH+finalGap);
      const cover=Math.max(finalCellW/img.width,finalCellH/img.height);
      const w=img.width*cover,h=img.height*cover;
      const sx=(w-finalCellW)/2,sy=(h-finalCellH)/2;
      ctx.save();ctx.beginPath();ctx.rect(x,y,finalCellW,finalCellH);ctx.clip();
      ctx.drawImage(img,x-sx,y-sy,w,h);ctx.restore();
      ctx.strokeStyle='#d1d5db';ctx.strokeRect(x,y,finalCellW,finalCellH);
    }
    lastCanvas=canvas;
    printBtn.disabled=false;downloadBtn.disabled=false;
    statusEl.textContent=`${count} फोटो की sheet तैयार है।`;
  };
  img.onerror=()=>{statusEl.textContent='फोटो render नहीं हो सकी। दूसरी फोटो चुनें।';};
  img.src=imageDataUrl;
}

printBtn.addEventListener('click',()=>window.print());
downloadBtn.addEventListener('click',()=>{
  if(!lastCanvas){alert('पहले Sheet बनाएं।');return;}
  const a=document.createElement('a');
  a.download='passport-photo-sheet.jpg';
  a.href=lastCanvas.toDataURL('image/jpeg',.92);
  document.body.appendChild(a);a.click();a.remove();
});
generate.addEventListener('click',makeSheet);
</script>
</body>
</html>
